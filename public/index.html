<style>
  :root{
    --paper:#f4f6f5; --card:#fff; --ink:#123038; --ink-soft:#5a7479; --line:#d6e3e4; --line-soft:#e8eff0;
    --accent:#1c5662; --accent-deep:#0b4856; --accent-soft:#e6f0f1;
    --gold:#d5aa4e; --gold-deep:#b8872f;
    --good:#3f7a52; --good-bg:#e3f0e6;
    --mid:#9a6b12; --mid-bg:#fbf0d9; --mid-line:#e6c77e;
    --bad:#a04a3c; --bad-bg:#f6e2dd;
    --cell-focus:#fff3d6;
    --rail-w:220px;
    --font-body:'Heebo',system-ui,sans-serif;
    --report-font:'BA Tzlotana','Heebo',serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--font-body); font-size:14px; -webkit-font-smoothing:antialiased;}
  .he{direction:rtl; unicode-bidi:isolate; font-family:var(--font-body);}
  .muted{color:var(--ink-soft);}
  .small{font-size:12px;}

  /* left rail – fixed width, never moves */
  #rail{position:fixed; top:0; left:0; bottom:0; width:var(--rail-w); background:var(--accent-deep); color:#eaf2f2; display:flex; flex-direction:column; padding:16px 12px; z-index:50; overflow-y:auto;}
  #rail .logo{text-align:center; margin-bottom:6px;}
  #rail .logo img{width:100%; max-width:150px; height:auto;}
  #rail .app-name{text-align:center; font-weight:700; font-size:17px; color:#fff; margin:0 0 16px; direction:rtl;}
  #rail nav{display:flex; flex-direction:column; gap:3px;}
  #rail nav button{display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:transparent; border:none; color:#d9e6e6; font-family:var(--font-body); font-size:14px; padding:9px 12px; border-radius:6px; cursor:pointer;}
  #rail nav button:hover{background:rgba(255,255,255,.08);}
  #rail nav button.active{background:var(--gold); color:var(--accent-deep); font-weight:700;}
  #rail nav button svg{flex:0 0 auto;}
  #rail .foot{margin-top:auto; padding-top:12px; border-top:1px solid rgba(255,255,255,.15); font-size:12px;}
  #rail .foot .who{color:#fff; word-break:break-all;}
  .role-badge{display:inline-block; margin-top:4px; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:700; background:rgba(255,255,255,.14); color:#fff;}
  .save-status{display:flex; align-items:center; gap:6px; margin:8px 0; color:#b9d2d2;}
  .save-status .dot{width:8px; height:8px; border-radius:50%; background:#7fbf8f;}
  .save-status.saving .dot{background:var(--gold);}
  .save-status.error .dot{background:#e08b7d;}
  #rail .foot button{width:100%; background:transparent; border:1px solid rgba(255,255,255,.35); color:#fff; border-radius:5px; padding:6px; cursor:pointer; font-family:var(--font-body); font-size:12px;}
  #rail .foot button:hover{background:rgba(255,255,255,.08);}

  main#content{margin-left:var(--rail-w); padding:22px 28px 70px; min-width:0;}
  .page-head{display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
  .page-head h1{font-size:22px; margin:0; color:var(--accent-deep);}
  .page-head .sp{flex:1;}
  section.panel{display:none;}
  section.panel.active{display:block;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:9px; padding:16px; margin-bottom:16px;}
  .card h2{font-size:15px; margin:0 0 12px; color:var(--accent-deep);}
  .card-head{display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap;}
  .card-head h2{margin:0;}
  .card-head .sp{flex:1;}
  .row{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .row.nowrap{flex-wrap:nowrap;}
  label{font-size:12px; color:var(--ink-soft);}
  input[type=text], input[type=number], input[type=email], input[type=password], select, textarea{font-family:var(--font-body); font-size:14px; padding:6px 9px; border:1px solid var(--line); border-radius:5px; background:#fff; color:var(--ink);}
  input:focus, select:focus, textarea:focus{outline:2px solid var(--accent); outline-offset:-1px;}
  input[dir=rtl]{text-align:right;}
  .btn{font-family:var(--font-body); font-size:13px; padding:7px 13px; background:var(--accent-deep); color:#fff; border:1px solid var(--accent-deep); border-radius:5px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; line-height:1.2;}
  .btn.sec{background:#fff; color:var(--accent-deep); border-color:var(--line);}
  .btn.sec:hover{border-color:var(--accent);}
  .btn.danger{background:var(--bad); border-color:var(--bad);}
  .btn.warn{background:var(--mid-bg); border-color:var(--mid-line); color:var(--mid);}
  .btn.ok{background:var(--good); border-color:var(--good);}
  .btn.sm{font-size:12px; padding:5px 10px;}
  .btn:disabled{opacity:.45; cursor:default;}
  .icon-btn{background:none; border:1px solid transparent; cursor:pointer; padding:5px; border-radius:5px; display:inline-flex; align-items:center; justify-content:center; color:var(--ink-soft);}
  .icon-btn:hover{background:var(--accent-soft); color:var(--accent-deep);}
  .icon-btn.danger:hover{background:var(--bad-bg); color:var(--bad);}
  .icon-btn.add{background:var(--accent-deep); color:#fff;}
  .icon-btn:disabled{opacity:.3; cursor:default;}
  [data-tip]{position:relative;}
  [data-tip]:hover::after{content:attr(data-tip); position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%); background:#123038; color:#fff; font-size:11px; font-weight:400; padding:4px 8px; border-radius:4px; white-space:nowrap; z-index:60; pointer-events:none; direction:ltr; font-family:var(--font-body);}
  .empty{padding:16px; border:1px dashed var(--line); border-radius:7px; color:var(--ink-soft); text-align:center; background:#fbfcfc; font-size:13px;}
  .pill{display:inline-flex; align-items:center; justify-content:center; min-width:24px; height:22px; padding:0 8px; border-radius:11px; font-size:12px; font-weight:700; background:var(--accent-soft); color:var(--accent-deep);}
  .tag{display:inline-block; padding:2px 9px; border-radius:11px; font-size:11px; font-weight:700; background:#eceff0; color:#66777c; white-space:nowrap;}
  .tag.ok{background:var(--good-bg); color:var(--good);}
  .tag.wait{background:var(--accent-soft); color:var(--accent-deep);}
  .tag.warn{background:var(--mid-bg); color:var(--mid);}
  .tag.bad{background:var(--bad-bg); color:var(--bad);}

  table.t{width:100%; border-collapse:collapse; font-size:13px;}
  table.t th, table.t td{border-bottom:1px solid var(--line-soft); padding:7px 9px; text-align:left; vertical-align:middle;}
  table.t th{background:#f3f6f6; color:var(--accent-deep); font-weight:600; font-size:12px;}
  table.t td.act{white-space:nowrap; width:1%; text-align:right;}
  table.t td.num{width:1%; color:var(--ink-soft);}
  table.t tr.click{cursor:pointer;}
  table.t tr.click:hover td{background:#f6f9f9;}
  table.t tr.sel td{background:#eef5f5;}
  table.t input[type=text], table.t select{width:100%; padding:5px 7px; font-size:13px;}
  .bad-cell{background:var(--bad-bg)!important; color:var(--bad)!important; font-weight:700;}
  .good-cell{background:var(--good-bg); color:var(--good); font-weight:700;}
  .mid-cell{background:var(--mid-bg); color:var(--mid); font-weight:700;}

  /* tabs (settings) – like Kriah */
  .tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:16px; flex-wrap:wrap;}
  .tabs button{font-family:var(--font-body); font-size:13px; padding:9px 14px; border:none; background:none; color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;}
  .tabs button:hover{color:var(--accent-deep);}
  .tabs button.on{color:var(--accent-deep); font-weight:700; border-bottom-color:var(--gold);}

  /* dashboard */
  .stat-grid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:16px;}
  .stat{border:1px solid var(--line); border-radius:9px; padding:12px 14px; background:#fff;}
  .stat .n{font-size:26px; font-weight:700; color:var(--accent-deep);}
  .stat .l{font-size:12px; color:var(--ink-soft);}
  .dash-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px;}
  .dash-grid .card{margin:0;}
  .dash-grid .wide{grid-column:1/-1;}
  .ins{border-top:4px solid var(--line);}
  .ins.low{border-top-color:var(--bad);} .ins.high{border-top-color:var(--good);} .ins.warn{border-top-color:var(--gold);}
  .ins h2{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .ins h2 .pill{margin-left:auto;}
  .ins.low .pill{background:var(--bad-bg); color:var(--bad);} .ins.high .pill{background:var(--good-bg); color:var(--good);} .ins.warn .pill{background:var(--mid-bg); color:var(--mid);}
  .thr{width:58px; text-align:center; font-weight:700; color:var(--accent-deep); padding:3px 4px!important;}
  .scroll-x{overflow-x:auto;}

  /* score grid */
  .grid-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:6px; background:#fff;}
  table.entry{border-collapse:collapse; font-size:13px; white-space:nowrap;}
  table.entry th, table.entry td{border:1px solid var(--line); padding:3px 4px; text-align:center;}
  table.entry thead th{background:#f3f6f6; font-weight:600; position:sticky; top:0; z-index:2;}
  table.entry thead tr.grp th{background:#e9f0f1; color:var(--accent-deep);}
  table.entry th.wkh{padding:4px 4px 6px;}
  table.entry th.wkh .wk{display:flex; align-items:center; justify-content:center; gap:5px;}
  table.entry th.wkh input{width:94%; margin-top:3px; text-align:center; font-weight:400; font-size:12px; padding:3px 2px;}
  table.entry td.name{text-align:left; background:#fafcfc; position:sticky; left:0; z-index:1; min-width:170px; padding:4px 8px;}
  table.entry td.name .he{display:block; font-size:12px; color:var(--ink-soft);}
  table.entry.ro td input{cursor:default;} table.entry.ro td input:focus{outline:none; background:transparent;}
  table.entry .gs{border-inline-start:3px solid var(--accent-deep)!important;}
  table.entry.rtl td.name{left:auto; right:0; text-align:right; font-size:14px; font-weight:600;}
  .icon-btn.warn-ic{color:var(--mid); background:var(--mid-bg); border-color:var(--mid-line);}
  table.entry td input{width:50px; border:none; text-align:center; padding:6px 2px; font-size:13px; background:transparent; font-family:var(--font-body);}
  table.entry td input:focus{outline:2px solid var(--accent); background:var(--cell-focus);}
  table.entry td.bad{background:var(--bad-bg);}
  table.entry td.bad input{color:var(--bad); font-weight:700;}
  table.entry td.unsure{background:var(--mid-bg);}
  table.entry td.unsure input{color:var(--mid); font-weight:700;}
  table.entry td input::placeholder{color:#b8c6c8;}
  .wk-btn{border:1px solid var(--line); background:#fff; color:var(--accent-deep); border-radius:4px; width:20px; height:20px; padding:0; cursor:pointer; font-size:14px; line-height:1; display:inline-flex; align-items:center; justify-content:center;}

  /* assessments */
  .month-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(205px,1fr)); gap:10px; margin-bottom:16px;}
  .mcard{border:1px solid var(--line); border-radius:9px; background:#fff; padding:12px; cursor:pointer;}
  .mcard:hover{border-color:var(--accent);}
  .mcard.sel{border-color:var(--accent-deep); box-shadow:0 0 0 2px var(--accent-soft);}
  .mcard .m{font-weight:700; font-size:15px; direction:rtl; text-align:left;}
  .mcard .s{font-size:12px; color:var(--ink-soft); margin:3px 0 9px; min-height:16px;}
  .mcard .acts{display:flex; gap:5px; flex-wrap:nowrap; align-items:center;}
  .mcard.stale{background:#fffaf0;}
  .scan-chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .scan-chip{border:1px solid var(--line); background:#fff; border-radius:16px; padding:6px 12px; cursor:pointer; font-family:var(--font-body); font-size:12px; color:var(--ink); display:inline-flex; gap:6px; align-items:center;}
  .scan-chip.sel{border-color:var(--accent-deep); background:var(--accent-soft); font-weight:700;}
  .scan-chip .d{width:8px; height:8px; border-radius:50%; background:#c3cfd0;}
  .scan-chip .d.ok{background:var(--good);} .scan-chip .d.warn{background:var(--gold);} .scan-chip .d.bad{background:var(--bad);} .scan-chip .d.busy{background:var(--accent); animation:pulse 1s infinite;}
  @keyframes pulse{50%{opacity:.3;}}
  .review{display:grid; grid-template-columns:minmax(260px,34%) minmax(0,1fr); gap:14px; align-items:start;}
  .review .img{border:1px solid var(--line); border-radius:6px; overflow:auto; max-height:72vh; background:#f3f6f6;}
  .review .img img{width:100%; display:block; cursor:zoom-in;}
  .review .img.zoom img{width:220%; cursor:zoom-out;}
  .notice{padding:10px 12px; border-radius:6px; font-size:13px; margin-bottom:12px; background:var(--accent-soft); color:var(--accent-deep);}
  .notice.warn{background:var(--mid-bg); color:var(--mid);}
  .notice.bad{background:var(--bad-bg); color:var(--bad);}
  .progress{height:6px; background:var(--line-soft); border-radius:3px; overflow:hidden; margin-top:8px;}
  .progress div{height:100%; background:var(--accent); transition:width .3s;}

  /* report designer & preview */
  .designer{display:grid; grid-template-columns:minmax(320px,38%) minmax(0,1fr); gap:16px; align-items:start;}
  .grp{background:#fff; border:1px solid var(--line); border-radius:8px; margin-bottom:10px; overflow:hidden;}
  .grp summary{list-style:none; cursor:pointer; padding:10px 12px; font-weight:700; color:var(--accent-deep); background:#f7faf9; display:flex; justify-content:space-between;}
  .grp summary::-webkit-details-marker{display:none;}
  .grp summary::after{content:'+'; color:var(--ink-soft);}
  .grp[open] summary::after{content:'–';}
  .grp .body{padding:10px 12px;}
  .fields{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .fields .full{grid-column:1/-1;}
  .field{display:flex; flex-direction:column; gap:3px; min-width:0;}
  .field input,.field select,.field textarea{width:100%;}
  .field textarea{min-height:52px; resize:vertical;}
  .sizes{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px;}
  .preview-box{background:#e9eeee; border:1px solid var(--line); border-radius:8px; padding:10px; display:flex; justify-content:center; overflow:hidden; position:relative;}
  .pager{display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:8px; font-size:13px; color:var(--ink-soft);}

  /* the report page: fixed letter size; letterhead always fills it */
  .report-page{width:8.5in; height:11in; position:relative; overflow:hidden; background-color:#fff; background-repeat:no-repeat; background-size:100% 100%; background-position:0 0; color:#111; direction:rtl; flex:0 0 auto;}
  .report-body{position:absolute; overflow:hidden;}
  .report-content{font-family:var(--report-font); transform-origin:top center;}
  .report-content .bsd{text-align:right; font-size:var(--r-classline-size);}
  .report-content .title{text-align:center; font-size:var(--r-title-size); margin:2px 0 8px; font-weight:400;}
  .report-content .lead{text-align:center; font-size:var(--r-lead-size); line-height:1.6; margin:0 0 4px;}
  .report-content .sname{text-align:center; font-size:var(--r-name-size); margin:8px 0 2px;}
  .report-content .cline{text-align:center; font-size:var(--r-classline-size); margin-bottom:12px; color:#333;}
  .report-content .note{text-align:center; font-size:var(--r-note-size); margin-bottom:12px; color:#444;}
  .report-content table.rtab{width:94%; margin:0 auto 12px; border-collapse:collapse;}
  .report-content table.rtab th{border:1px solid #333; padding:5px 7px; text-align:center; background:rgba(0,0,0,.06); font-size:var(--r-thead-size); font-weight:400;}
  .report-content table.rtab td{border:1px solid #333; padding:5px 7px; text-align:center; font-size:var(--r-tbody-size); background:rgba(255,255,255,.6);}
  .report-content .catline{text-align:center; font-size:var(--r-note-size); margin:4px 0 8px; text-decoration:underline;}
  .report-content .signline{margin-top:20px; font-size:var(--r-sign-size); text-align:center;}
  .report-content .signline .rule{display:inline-block; width:220px; border-bottom:1px solid #333; margin-inline-start:8px;}
  .report-content .fail{font-size:.85em;}
  .fail-set{display:flex; align-items:center; gap:6px; flex-wrap:wrap; background:var(--accent-soft); border-radius:6px; padding:8px 10px; margin-bottom:12px; font-size:13px;}
  .fail-set input{width:62px; text-align:center; font-weight:700;}
  .copy-mark{position:absolute; top:.35in; left:.45in; font-family:var(--font-body); font-size:10px; color:#999; direction:rtl;}

  /* audit */
  tr.undone td{color:#90a3a6;}
  tr.undone td .what{text-decoration:line-through;}
  .audit-bar{display:flex; gap:8px; align-items:center; margin-bottom:12px;}
  .audit-bar input{flex:1; max-width:360px;}

  /* password eye */
  .pw-wrap{position:relative; display:flex; align-items:center;}
  .pw-wrap input{width:100%; padding-right:36px!important;}
  .pw-wrap .eye{position:absolute; right:6px; background:none; border:none; cursor:pointer; color:var(--ink-soft); padding:3px; display:inline-flex;}

  /* overlays */
  .overlay{position:fixed; inset:0; z-index:9000; background:rgba(7,42,50,.7); display:flex; align-items:center; justify-content:center; padding:20px;}
  .overlay.hidden{display:none;}
  .gate{background:var(--accent-deep);}
  .modal{width:min(460px,100%); background:#fff; border-radius:10px; padding:22px; box-shadow:0 24px 70px rgba(0,0,0,.3); max-height:90vh; overflow:auto;}
  .modal.wide{width:min(980px,100%);}
  .modal h2{margin:0 0 14px; color:var(--accent-deep); font-size:18px;}
  .modal .fl{display:grid; gap:10px;}
  .modal .fl label{display:block; margin-bottom:4px;}
  .modal .fl input,.modal .fl select{width:100%; padding:8px 10px;}
  .modal .actions{display:flex; gap:8px; justify-content:flex-end; margin-top:16px;}
  .modal .msg{min-height:18px; margin-top:10px; font-size:12px; color:var(--bad);}
  .modal p{font-size:14px; line-height:1.5; margin:0;}
  #toast{position:fixed; bottom:22px; left:calc(50% + var(--rail-w)/2); transform:translateX(-50%) translateY(20px); background:#123038; color:#fff; padding:10px 14px; border-radius:7px; font-size:13px; display:flex; gap:12px; align-items:center; opacity:0; pointer-events:none; transition:all .2s; z-index:9500; box-shadow:0 8px 24px rgba(0,0,0,.2);}
  #toast.show{opacity:1; transform:translateX(-50%); pointer-events:auto;}
  #toast button{background:none; border:1px solid rgba(255,255,255,.4); color:#fff; border-radius:4px; padding:4px 10px; cursor:pointer; font-family:var(--font-body); font-weight:700;}
  .hide{display:none!important;}
  .stat-grid.three{grid-template-columns:repeat(3,minmax(0,1fr));}
  .dash-cols{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; align-items:start;}
  .dash-cols .card{margin:0; padding:14px;}
  .dash-cols h2{font-size:14px;}
  .dlist{display:flex; flex-direction:column; max-height:440px; overflow-y:auto;}
  .drow{display:flex; align-items:center; gap:8px; width:100%; background:none; border:none; border-bottom:1px solid var(--line-soft); padding:7px 2px; cursor:pointer; font-family:var(--font-body); color:var(--ink); text-align:right;}
  .drow:hover{background:#f6f9f9;}
  .drow .n{flex:1; font-size:14px; font-weight:600;}
  .drow .c{font-size:12px; color:var(--ink-soft);}
  .drow .sj{font-size:12px; color:var(--accent-deep); background:var(--accent-soft); border-radius:9px; padding:1px 8px;}
  .dash-cols.three{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr);}
  .drow .v{min-width:34px; text-align:center; font-weight:700; font-size:12px; border-radius:10px; padding:2px 6px;}
  .drow .v.bad{background:var(--bad-bg); color:var(--bad);} .drow .v.good{background:var(--good-bg); color:var(--good);} .drow .v.mid{background:var(--mid-bg); color:var(--mid);}
  .seg{display:inline-flex; align-items:center; gap:1px; border:1px solid var(--line); border-radius:6px; padding:0 2px 0 7px; margin-left:6px; background:#fff;}
  .seg small{font-size:10.5px; color:var(--ink-soft); margin-right:2px;}
  .month-cards.wide{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));}
  .pf-head{display:flex; align-items:center; gap:20px; flex-wrap:wrap;}
  .pf-head > div:first-child{flex:1;}
  .pf-name{font-size:28px; font-weight:700; color:var(--accent-deep); text-align:left;}
  .pf-meta{display:flex; gap:24px;} .pf-meta div{display:flex; flex-direction:column;}
  .t-bad{color:var(--bad)!important;} .t-good{color:var(--good)!important;}
  .trend{display:flex; gap:14px; align-items:flex-end; height:170px; padding-top:6px; direction:rtl;}
  .trend .tb{display:flex; flex-direction:column; align-items:center; gap:4px; width:60px;}
  .trend .bar-wrap{height:110px; width:34px; display:flex; align-items:flex-end; background:#f1f5f5; border-radius:5px;}
  .trend .bar{width:100%; background:var(--accent); border-radius:5px;} .trend .bar.b{background:var(--bad);} .trend .bar.g{background:var(--good);}
  .trend b{font-size:13px;} .trend span{font-size:12px; color:var(--ink-soft);}
  table.pf-table{width:100%;} table.pf-table td{padding:7px 8px; font-size:13px;} table.pf-table tr.click{cursor:pointer;} table.pf-table tr.click:hover td{background:#f6f9f9;}
  @media (max-width:1200px){ .dash-cols{grid-template-columns:repeat(2,minmax(0,1fr));} }
  .cs-grid{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:16px; align-items:start;}
  @media (max-width:1100px){ .cs-grid{grid-template-columns:1fr;} }
  a{color:var(--accent);}

  @media (max-width:1100px){ .designer,.review{grid-template-columns:1fr;} }
  @media (max-width:900px){ .dash-grid{grid-template-columns:1fr;} .dash-grid .wide{grid-column:auto;} .stat-grid{grid-template-columns:repeat(2,1fr);} }
</style>
</head>
<body>
<div id="gate" class="overlay gate hidden">
  <div class="modal">
    <div style="text-align:center;margin-bottom:10px;"><img id="gateLogo" alt="" style="max-width:160px;background:var(--accent-deep);border-radius:8px;padding:8px;"></div>
    <h2>Sign in</h2>
    <div class="fl">
      <div><label for="loginEmail">Email</label><input type="email" id="loginEmail" autocomplete="username"></div>
      <div><label for="loginPassword">Password</label><div class="pw-wrap"><input type="password" id="loginPassword" autocomplete="current-password"><button type="button" class="eye" tabindex="-1"></button></div></div>
    </div>

</div>
<div id="modal" class="overlay hidden"><div class="modal" id="modalBox"></div></div>

<script>
(function(){
'use strict';
const CFG = window.GILYON_CONFIG || null;
const CLOUD = !!(CFG && CFG.supabaseUrl && CFG.supabasePublishableKey);
/* =====================================================================
   Storage – this version saves in this browser (IndexedDB).
   Same data shape as the cloud version will use.
   ===================================================================== */
const DB_NAME = 'gilyon_eval_local';
const KV = (()=>{
  let dbp = null;
  function open(){
    if(dbp) return dbp;
    dbp = new Promise((res, rej)=>{
      if(!window.indexedDB) return rej(new Error('no indexedDB'));
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = ()=> r.result.createObjectStore('kv');
      r.onsuccess = ()=> res(r.result);
      r.onerror = ()=> rej(r.error);
    });
    return dbp;
  }
  async function get(k){
    try{ const db = await open(); return await new Promise((res, rej)=>{ const q = db.transaction('kv','readonly').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
    catch(e){ const v = localStorage.getItem(DB_NAME+'_'+k); return v ? JSON.parse(v) : undefined; }
  }
  async function set(k, v){
    try{ const db = await open(); await new Promise((res, rej)=>{ const tx = db.transaction('kv','readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }
    catch(e){ localStorage.setItem(DB_NAME+'_'+k, JSON.stringify(v)); }
  }
  return {get, set};
})();

function fillSelect(sel, items, valFn, labelFn, placeholder){

  sel.innerHTML = (placeholder ? `<option value="">${esc(placeholder)}</option>` : '') + items.map(it=>`<option value="${esc(valFn(it))}">${esc(labelFn(it))}</option>`).join('');

function hebYearStr(n){
  let v = n % 1000, out = '';
  [[400,'ת'],[300,'ש'],[200,'ר'],[100,'ק']].forEach(([val,ch])=>{ while(v>=val){ out+=ch; v-=val; } });

  else { const tens = ['','י','כ','ל','מ','נ','ס','ע','פ','צ'], ones = ['','א','ב','ג','ד','ה','ו','ז','ח','ט']; out += tens[Math.floor(v/10)] + ones[v%10]; }
  return out.length>1 ? out.slice(0,-1)+'"'+out.slice(-1) : out+"'";
}
const GEM = {'א':1,'ב':2,'ג':3,'ד':4,'ה':5,'ו':6,'ז':7,'ח':8,'ט':9,'י':10,'כ':20,'ך':20,'ל':30,'מ':40,'ם':40,'נ':50,'ן':50,'ס':60,'ע':70,'פ':80,'ף':80,'צ':90,'ץ':90,'ק':100,'ר':200,'ש':300,'ת':400};
function parseHebYear(s){
  const letters = String(s||'').replace(/["'״׳]/g,'');
  if(!letters || /[^א-ת]/.test(letters)) return null;
  let sum = 0; for(const ch of letters){ if(!GEM[ch]) return null; sum += GEM[ch]; }
  return sum < 1000 ? 5000 + sum : sum;
}
function normYear(s){ const n = parseHebYear(s); return n ? hebYearStr(n) : String(s||''); }
function currentSchoolYearNum(){ const d = new Date(); return d.getFullYear() + 3760 + (d.getMonth() >= 7 ? 1 : 0); }
function monthName(label){ const first = String(label||'').trim().split(/\s+/)[0]; return MONTH_ALIASES[first] || first; }
function monthSchoolYear(label){

}
function monthOrder(m){ const i = HEB_MONTHS.indexOf(monthName(m.label)); return i===-1 ? 100 : i; }
function yearNum(y){ return parseHebYear(y) || 0; }
function monthsOfYear(y){ return st.months.filter(m=>m.year===y).sort((a,b)=> monthOrder(a)-monthOrder(b) || st.months.indexOf(a)-st.months.indexOf(b)); }

function schoolYears(){ const set = new Set(st.months.map(m=>m.year).filter(Boolean)); if(st.currentYear) set.add(st.currentYear); return Array.from(set).sort((a,b)=>yearNum(a)-yearNum(b)); }

}

function migrateLoadedState(){

/* =====================================================================
   Audit log, Undo & Redo.
   Each change keeps what it replaced. Undo puts that back and marks the
   row "Undone" (no new row). Redo puts the change back again.
   Only your own changes are listed and can be undone.
   ===================================================================== */
const TRACK = ['classes','staff','students','months','grades','sheets','reportStatus','sizes','layout','reportText','printLetterhead','reportPresets','dashboardThresholds','currentYear','failBelow'];
const SUBKEYED = new Set(['students','grades','sheets','reportStatus']);
let audit = [];
let snap = null;
let pending = [];
let flushTimer = null;
let persistChain = Promise.resolve();

function trackState(){ const o = {}; TRACK.forEach(k=> o[k] = st[k]); return clone(o); }
// Changes are tracked by path, e.g. ['grades', 'class::month', 'perStudent', studentId],
// so Undo and saving touch only what changed – not other people's edits next to it.
const hasOwn = (o,k) => o!==null && typeof o==='object' && Object.prototype.hasOwnProperty.call(o,k);
const pathOf = p => p.p || (p.sk!==undefined ? [p.k, p.sk] : [p.k]);   // older entries used k/sk
function getAt(obj, path){ let o = obj; for(let i=0;i<path.length-1;i++){ o = o ? o[path[i]] : undefined; } const last = path[path.length-1]; return {had: hasOwn(o, last), v: hasOwn(o, last) ? o[last] : undefined}; }
function setAt(obj, path, had, v){
  let o = obj;
  for(let i=0;i<path.length-1;i++){ if(!o[path[i]] || typeof o[path[i]]!=='object') o[path[i]] = {}; o = o[path[i]]; }
  const last = path[path.length-1];
  if(had) o[last] = clone(v); else delete o[last];
}
function diffPatch(before, after){
  const patch = [], push = (path, b) => { const g = getAt(b, path); patch.push({p:path, had:g.had, v:clone(g.v)}); };
  const isObj = x => x && typeof x==='object' && !Array.isArray(x);
  const deep = (path, b, a)=>{
    if(same(b, a)) return;
    if(isObj(b) && isObj(a)) return new Set([...Object.keys(b), ...Object.keys(a)]).forEach(f=> deep(path.concat(f), b[f], a[f]));
    if(Array.isArray(b) && Array.isArray(a) && b.length===a.length) return b.forEach((x,i)=> deep(path.concat(String(i)), b[i], a[i]));
    push(path, before);
  };
  TRACK.forEach(k=>{
    const b = before[k], a = after[k];
    if(same(b,a)) return;
    if(!(SUBKEYED.has(k) && b && a && typeof b==='object' && typeof a==='object')) return push([k], before);
    new Set([...Object.keys(b), ...Object.keys(a)]).forEach(sk=>{
      const bs = b[sk], as = a[sk];
      if(same(bs, as)) return;
      if(k==='grades') deep([k, sk], bs, as);   // down to a single score
      else push([k, sk], before);
    });
  });
  return patch;
}
function readPatch(patch){ return patch.map(p=>{ const path = pathOf(p), g = getAt(st, path); return {p:path, had:g.had, v:clone(g.v)}; }); }
function applyPatch(patch){ patch.forEach(p=> setAt(st, pathOf(p), p.had, p.v)); }
function pruneAudit(){ const cut = Date.now() - AUDIT_DAYS*864e5; audit = audit.filter(e=>e.ts >= cut); }
const mine = e => me && e.user===me.email;
function addAuditEntry(label, patch){
  const now = Date.now();
  // a new change ends the chance to redo older undone changes
  audit.forEach(e=>{ if(mine(e) && e.undone) e.dead = true; });
  const top = audit.find(mine);
  if(top && top.patch && !top.undone && top.action===label.action && top.detail===label.detail && now-(top.lastTs||top.ts) < 90000){
    patch.forEach(p=>{ if(!top.patch.some(q=>same(pathOf(q), pathOf(p)))) top.patch.push(p); });
    top.lastTs = now; return;
  }
  audit.unshift({id:uid(), ts:now, lastTs:now, user:me.email, action:label.action, detail:label.detail, patch});
}
function logEvent(action, detail){
  audit.unshift({id:uid(), ts:Date.now(), user: me ? me.email : '', action, detail:detail||'', patch:null});
  pruneAudit(); persistAudit(); if(activeTab==='audit') renderAudit();
}
function canEdit(){ return !!me && me.role==='admin'; }
function saveAll(action, detail){
  if(!canEdit()) return;
  if(action) pending.push({action, detail: detail||''});
  setStatus('saving');
  clearTimeout(flushTimer);

}
function flushNow(){
  clearTimeout(flushTimer); flushTimer = null;
  if(!canEdit() || !snap) return;
  const now = trackState();
  const patch = diffPatch(snap, now);
  if(patch.length){ addAuditEntry(pending[0] || {action:'Edit', detail:''}, patch); pruneAudit(); }
  pending = [];
  snap = now;
  persistState();
  if(activeTab==='audit') renderAudit();
}
function statePayload(){ const o = {schemaVersion:7}; TRACK.forEach(k=> o[k] = st[k]); return clone(o); }
function persistState(){
  if(CLOUD) return cloudPush();
  const payload = statePayload(), aud = clone(audit);
  persistChain = persistChain.then(async ()=>{ await KV.set('state', payload); await KV.set('audit', aud); setStatus('saved'); })
    .catch(err=>{ console.error(err); setStatus('error'); });
  return persistChain;
}
function persistAudit(){ if(CLOUD) return flushAuditCloud(); const aud = clone(audit); persistChain = persistChain.then(()=>KV.set('audit', aud)).catch(()=>{}); }

function undoTarget(){ return audit.find(e=> mine(e) && e.patch && e.patch.length && !e.undone) || null; }
function redoTarget(){ let t = null; audit.forEach(e=>{ if(mine(e) && e.patch && e.undone && !e.dead) t = e; }); return t; }
function afterUndoRedo(){ migrateLoadedState(); snap = trackState(); persistState(); renderActive(); }
function doUndo(){
  flushNow();
  const e = undoTarget(); if(!e) return false;
  e.redoPatch = readPatch(e.patch);
  applyPatch(e.patch);
  e.undone = true;
  afterUndoRedo(); return e;
}
function doRedo(){
  flushNow();
  const e = redoTarget(); if(!e || !e.redoPatch) return false;
  applyPatch(e.redoPatch);
  e.undone = false; delete e.redoPatch;
  afterUndoRedo(); return e;
}
// finish the previous change before a click, choice or Enter starts a new one
['click','change'].forEach(ev=> document.addEventListener(ev, ()=>{ if(pending.length) flushNow(); }, true));

/* =====================================================================
   Cloud (Supabase). Used when the site has config.js (Netlify build).
   Opening the file on a computer without config.js runs the test version.
   ===================================================================== */
let SB = null, cloudVersion = 0, synced = null, pushing = false, pushAgain = false, pollTimer = null;
let secrets = {}, auditSent = new Map();
async function sbInit(){
  if(SB) return SB;
  await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js', 'supabase');
  if(!window.supabase || !window.supabase.createClient) throw new Error('Supabase could not load. Check the internet connection and reload.');
  SB = window.supabase.createClient(CFG.supabaseUrl, CFG.supabasePublishableKey, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}});
  return SB;
}
const sbErr = r => { if(r && r.error) throw new Error(r.error.message || String(r.error)); return r ? r.data : null; };

/* ---- saving: only what changed is sent; the database merges it ---- */
function cloudPush(full){
  if(!canEdit()) return Promise.resolve();
  if(pushing){ pushAgain = true; return persistChain; }
  const now = trackState();
  const ops = (full ? Object.keys(now).map(k=>({p:[k]})) : diffPatch(synced||{}, now)).map(x=>{
    const g = getAt(now, x.p); return g.had ? {p:x.p, had:true, v:g.v} : {p:x.p, had:false};
  });
  if(full) ops.push({p:['schemaVersion'], had:true, v:7});
  if(!ops.length){ setStatus('saved'); flushAuditCloud(); return Promise.resolve(); }
  pushing = true; setStatus('saving');
  persistChain = SB.rpc('gilyon_apply', {ops}).then(r=>{
    pushing = false; cloudVersion = Number(sbErr(r)) || cloudVersion; synced = now; setStatus('saved');
    flushAuditCloud();
    if(pushAgain){ pushAgain = false; cloudPush(); }
  }).catch(err=>{ pushing = false; console.error(err); setStatus('error'); toast('Not saved: '+err.message); });
  return persistChain;
}
/* ---- other people's changes: checked every 20 seconds ---- */
const typingNow = () => { const a = document.activeElement; return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.closest('main')); };
async function cloudPull(){
  if(!SB || pushing || pending.length || flushTimer) return;
  try{
    const row = sbErr(await SB.from('gilyon_state').select('version').eq('id','main').maybeSingle());
    if(!row || Number(row.version) <= cloudVersion) return;
    if(canEdit() && synced && diffPatch(synced, trackState()).length){ cloudPush(); return; }   // send my change first
    if(typingNow()) return;                                         // try again next time
    const full = sbErr(await SB.from('gilyon_state').select('data,version').eq('id','main').maybeSingle());
    applyRemote(full);
    renderActive();
  }catch(e){ console.warn('Cloud check failed', e); }
}
// what the database has, in the same shape as trackState()
function remoteTrack(data){ const o = {}; TRACK.forEach(k=>{ if(data && data[k]!==undefined) o[k] = clone(data[k]); }); return o; }
function applyRemote(row){
  const data = (row && row.data) || {};
  TRACK.forEach(k=>{ if(data[k]!==undefined) st[k] = clone(data[k]); });
  cloudVersion = Number(row && row.version || 0);
  synced = remoteTrack(data);
  migrateLoadedState();
  snap = trackState();
  if(canEdit() && diffPatch(synced, snap).length) cloudPush();   // anything the app had to add (new months etc.)
}
function startPoll(){
  clearInterval(pollTimer); pollTimer = setInterval(cloudPull, 20000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) cloudPull(); });
}
/* ---- audit log rows (each person sees only their own) ---- */
function flushAuditCloud(){
  if(!SB || !me) return;
  const rows = audit.filter(mine).filter(e=> auditSent.get(e.id)!==JSON.stringify(e));
  if(!rows.length) return;
  const payload = rows.map(e=>({id:e.id, user_email:e.user, ts:e.ts, data:e}));
  SB.from('gilyon_audit').upsert(payload).then(r=>{ if(r.error){ console.warn(r.error); return; } rows.forEach(e=> auditSent.set(e.id, JSON.stringify(e))); });
}
async function loadAuditCloud(){
  const cut = Date.now() - AUDIT_DAYS*864e5;
  try{ await SB.from('gilyon_audit').delete().lt('ts', cut).eq('user_email', me.email); }catch(e){}
  const rows = sbErr(await SB.from('gilyon_audit').select('data').eq('user_email', me.email).gte('ts', cut).order('ts', {ascending:false}).limit(2000)) || [];
  audit = rows.map(r=>r.data).filter(Boolean);
  audit.forEach(e=> auditSent.set(e.id, JSON.stringify(e)));
}

/* =====================================================================
   Averages
   ===================================================================== */
function avgOf(arr){ const nums = arr.filter(v=>v!==''&&v!=null).map(Number).filter(n=>!isNaN(n)); return nums.length ? nums.reduce((a,b)=>a+b,0)/nums.length : null; }
function studentOverallAvg(d, cls, wc){
  const wv = []; cls.subjects.filter(s=>s.kind==='week').forEach(s=> (d.week[s.id]||[]).slice(0,wc).forEach(v=>{ if(v!=='') wv.push(Number(v)); }));
  const w = avgOf(wv);
  const c = avgOf(cls.subjects.filter(s=>s.kind==='cat').map(s=> d.cat[s.id]==='' || d.cat[s.id]===undefined ? '' : Number(d.cat[s.id])*10));
  return avgOf([w, c].filter(v=>v!==null));
}
function studentYearAvg(cls, sid){
  const vals = [];
  sortedMonths().forEach(m=>{ const rec = recFor(cls.id, m.id), d = rec && rec.perStudent[sid]; if(!d) return; ensureRecordShape(d, cls); const v = studentOverallAvg(d, cls, rec.weekCount); if(v!==null) vals.push(v); });
  return avgOf(vals);
}
function unionSubjects(){ const map = new Map(); st.classes.forEach(c=> (c.subjects||[]).forEach(s=>{ const k = s.kind+'::'+s.label; if(!map.has(k)) map.set(k, {kind:s.kind, label:s.label}); })); return Array.from(map.values()); }
function classSubjectYearAvg(cls, subj){
  const match = (cls.subjects||[]).find(s=>s.kind===subj.kind && s.label===subj.label); if(!match) return null;
  const monthly = [];
  sortedMonths().forEach(m=>{
    const rec = recFor(cls.id, m.id); if(!rec) return;
    const vals = [];
    studentsOf(cls.id).forEach(s=>{
      const d = rec.perStudent[s.id]; if(!d) return; ensureRecordShape(d, cls);
      if(subj.kind==='cat'){ if(d.cat[match.id]!=='') vals.push(Number(d.cat[match.id])*10); }
      else (d.week[match.id]||[]).slice(0,rec.weekCount).forEach(v=>{ if(v!=='') vals.push(Number(v)); });
    });
    const a = avgOf(vals); if(a!==null) monthly.push(a);
  });
  return avgOf(monthly);
}
function hasAnyScore(d){
  if(!d) return false;
  if([d.chesarim,d.ichurim,d.yatza].some(v=>v!=='' && v!=null)) return true;
  if(Object.values(d.cat||{}).some(v=>v!=='' && v!=null)) return true;
  return Object.values(d.week||{}).some(a=>(a||[]).some(v=>v!=='' && v!=null));
}
const monthHasScores = (classId, monthId) => { const r = recFor(classId, monthId); return !!r && Object.values(r.perStudent).some(hasAnyScore); };

/* =====================================================================
   Dashboard – compact lists with Hebrew names; click a student to open them
   ===================================================================== */
function studentTotals(cls, sid){
  let ab = 0, la = 0, ye = 0;
  sortedMonths().forEach(m=>{ const rec = recFor(cls.id, m.id), d = rec && rec.perStudent[sid]; if(!d) return;
    const n = v => (v!=='' && v!=null && !isNaN(Number(v))) ? Number(v) : 0;
    ab += n(d.chesarim); la += n(d.ichurim); ye += n(d.yatza); });
  return {ab, la, ye};
}
// a student's year average for one subject (monthly 1–10, weekly 0–100)
function studentSubjectAvg(cls, sid, sj){
  const vals = [];
  sortedMonths().forEach(m=>{ const rec = recFor(cls.id, m.id), d = rec && rec.perStudent[sid]; if(!d) return;
    if(sj.kind==='cat'){ const v = (d.cat||{})[sj.id]; if(v!=='' && v!=null && !isNaN(Number(v))) vals.push(Number(v)); }
    else ((d.week||{})[sj.id]||[]).slice(0, rec.weekCount).forEach(v=>{ if(v!=='' && v!=null && !isNaN(Number(v))) vals.push(Number(v)); });
  });
  return avgOf(vals);
}
function renderDashboard(){
  const T = st.dashboardThresholds, P = $('panel-dashboard');
  const all = [], low = [];
  st.classes.forEach(cls=> studentsOf(cls.id).forEach(s=>{
    all.push(Object.assign({cls, s}, studentTotals(cls, s.id)));
    (cls.subjects||[]).forEach(sj=>{
      const a = studentSubjectAvg(cls, s.id, sj); if(a===null) return;
      const pct = sj.kind==='cat' ? a*10 : a;
      if(pct < T.low) low.push({cls, s, sj, a, pct});
    });
  }));
  low.sort((x,y)=>x.pct-y.pct);
  const abs = all.filter(r=>r.ab > T.absences).sort((a,b)=>b.ab-a.ab);
  const lat = all.filter(r=>r.la > T.lates).sort((a,b)=>b.la-a.la);
  const monthsWith = sortedMonths().filter(m=> st.classes.some(c=>monthHasScores(c.id, m.id))).length;
  const thr = k => `<input type="number" class="thr" data-thr="${k}" value="${T[k]}" min="0" ${canEdit()?'':'disabled'}>`;
  const fmt = r => r.sj.kind==='cat' ? (Math.round(r.a*10)/10).toString() : Math.round(r.a);
  const list = (rows, val, klass, sub) => rows.length ? `<div class="dlist">${rows.map(r=>`<button type="button" class="drow" data-cls="${esc(r.cls.id)}" data-sid="${esc(r.s.id)}"><span class="v ${klass}">${val(r)}</span>${sub?`<span class="sj he">${esc(r.sj.label)}</span>`:''}<span class="c he">${esc(heName(r.cls))}</span><span class="n he">${esc(heName(r.s))}</span></button>`).join('')}</div>` : '<div class="empty">None</div>';
  P.innerHTML = pageHead('Dashboard', `<span class="tag wait he" style="font-size:13px;">${esc(st.currentYear)}</span>`) + `
    <div class="stat-grid three">
      <div class="stat"><div class="n">${all.length}</div><div class="l">Students</div></div>
      <div class="stat"><div class="n">${st.classes.length}</div><div class="l">Classes</div></div>
      <div class="stat"><div class="n">${monthsWith}</div><div class="l">Months with scores</div></div>
    </div>
    <div class="dash-cols three">
      <div class="card ins low"><h2>Below ${thr('low')} by subject <span class="pill">${low.length}</span></h2><div class="small muted" style="margin:-6px 0 8px;">Monthly subjects below ${T.low/10} out of 10</div>${list(low, fmt, 'bad', true)}</div>
      <div class="card ins low"><h2>Absences over ${thr('absences')} <span class="pill">${abs.length}</span></h2>${list(abs, r=>r.ab, 'bad')}</div>
      <div class="card ins warn"><h2>Lates over ${thr('lates')} <span class="pill">${lat.length}</span></h2>${list(lat, r=>r.la, 'mid')}</div>
    </div>`;
  P.querySelectorAll('.thr').forEach(inp=> inp.addEventListener('change', ()=>{
    st.dashboardThresholds[inp.dataset.thr] = Math.max(0, Math.floor(Number(inp.value)||0));
    saveAll('Dashboard limits'); renderDashboard();
  }));
  P.querySelectorAll('.drow').forEach(b=> b.addEventListener('click', ()=> openProfile(b.dataset.cls, b.dataset.sid)));
}

  const months = sortedMonths().filter(m=>{ const r = recFor(cls.id, m.id); return r && hasAnyScore(r.perStudent[s.id]); });
  const catS = cls.subjects.filter(x=>x.kind==='cat'), weekS = cls.subjects.filter(x=>x.kind==='week');
  const t = studentTotals(cls, s.id), ya = studentYearAvg(cls, s.id);
  const rows = months.map(m=>{

    return {m, rec, d, avg: studentOverallAvg(d, cls, rec.weekCount), wAvg};
  });
  const T = st.dashboardThresholds, tone = v => v===null ? '' : v < T.low ? 'bad-cell' : v >= T.high ? 'good-cell' : '';

  const body = rows.map(r=>`<tr class="click" data-m="${r.m.id}"><td class="name">${esc(r.m.label)}</td><td class="gs">${esc(r.d.chesarim)}</td><td>${esc(r.d.ichurim)}</td><td>${esc(r.d.yatza)}</td>
    ${catS.map((x,i)=>`<td class="${i===0?'gs':''}">${esc(r.d.cat[x.id]||'')}</td>`).join('')}${weekS.map((x,i)=>{ const a = r.wAvg(x); return `<td class="${i===0?'gs':''}">${a===null?'':Math.round(a)}</td>`; }).join('')}
    <td class="gs ${tone(r.avg)}">${r.avg===null?'':Math.round(r.avg)}</td></tr>`).join('');
  P.innerHTML = `<div class="page-head"><button class="btn sec sm" id="pfBack">${ICON.left}${canEdit()?'Students':'Dashboard'}</button><span class="sp"></span><button class="btn sec" id="pfEdit">${canEdit()?ICON.edit+'Edit scores':'Scores'}</button></div>
    <div class="card pf-head"><div><div class="pf-name he">${esc(heName(s))}</div><div class="muted">${esc(s.name||'')}</div></div>
      <div class="pf-meta"><div><span class="muted small">Class</span><b>${esc(classLabel(cls))}</b></div><div><span class="muted small">Teacher</span><b class="he">${esc(heName(teacherOf(cls))||'—')}</b></div></div></div>
    <div class="stat-grid">
      <div class="stat"><div class="n ${ya===null?'':ya<T.low?'t-bad':ya>=T.high?'t-good':''}">${ya===null?'—':Math.round(ya)}</div><div class="l">Average</div></div>
      <div class="stat"><div class="n">${t.ab}</div><div class="l">Absences</div></div>
      <div class="stat"><div class="n">${t.la}</div><div class="l">Lates</div></div>
      <div class="stat"><div class="n">${t.ye}</div><div class="l">Left early</div></div>
    </div>
    <div class="card"><h2>Average by month</h2>${trend}</div>

let stuFilter = '', stuSearch = '';
function findOrCreateClass(name, nameHe){
  name = String(name||'').trim(); nameHe = String(nameHe||'').trim();
  if(!name && !nameHe) return null;
  let cls = st.classes.find(c=> (name && (c.name===name || c.nameHe===name)) || (nameHe && (c.nameHe===nameHe || c.name===nameHe)));
  if(!cls){ cls = {id:uid(), name: name && !isHeb(name) ? name : '', nameHe: nameHe || (isHeb(name)?name:''), teacherId:'', subjects: defaultSubjects()}; st.classes.push(cls); st.students[cls.id] = []; }
  else { if(!cls.nameHe && nameHe) cls.nameHe = nameHe; if(!cls.name && name && !isHeb(name)) cls.name = name; }
  return ensureClassShape(cls);
}
function findOrCreateStaff(nameEn, nameHe){
  nameEn = String(nameEn||'').trim(); nameHe = String(nameHe||'').trim();
  if(!nameEn && !nameHe) return null;
  let s = st.staff.find(x=> (nameEn && (x.nameEn===nameEn || x.nameHe===nameEn)) || (nameHe && (x.nameHe===nameHe || x.nameEn===nameHe)));
  if(!s){ s = {id:uid(), nameEn: nameEn && !isHeb(nameEn) ? nameEn : '', nameHe: nameHe || (isHeb(nameEn)?nameEn:'')}; st.staff.push(s); }
  else { if(!s.nameHe && nameHe) s.nameHe = nameHe; if(!s.nameEn && nameEn && !isHeb(nameEn)) s.nameEn = nameEn; }
  return s;
}
function findOrCreateStudent(classId, name, nameHe){
  name = String(name||'').trim(); nameHe = String(nameHe||'').trim();
  if(isHeb(name) && !nameHe){ nameHe = name; name = ''; }
  if(!name && !nameHe) return null;
  st.students[classId] = st.students[classId] || [];
  let s = st.students[classId].find(x=> (name && x.name===name) || (nameHe && x.nameHe===nameHe));
  if(!s){ s = {id:uid(), name, nameHe}; st.students[classId].push(s); }
  else { if(!s.nameHe && nameHe) s.nameHe = nameHe; if(!s.name && name) s.name = name; }
  return s;
}
function moveStudent(s, fromId, toId){
  if(fromId===toId) return;
  st.students[fromId] = studentsOf(fromId).filter(x=>x.id!==s.id);
  st.students[toId] = studentsOf(toId).concat([s]);
  const to = classById(toId);
  Object.keys(st.grades).forEach(k=>{
    const [cid, mid] = k.split('::'); if(cid!==fromId) return;
    const d = st.grades[k].perStudent[s.id]; if(!d) return;
    delete st.grades[k].perStudent[s.id];
    const rec = getGradeRecord(toId, mid);
    rec.perStudent[s.id] = ensureRecordShape(d, to);
  });
}

/* ---------- paste from Excel / upload CSV ---------- */
function parseStudentRows(rows){
  // columns: Class · English name · Hebrew name   (a header row is skipped)
  const out = [];
  rows.forEach((r, i)=>{
    r = (r||[]).map(v=>String(v??'').trim());
    if(!r.some(Boolean)) return;
    if(i===0 && /class|כתה|כיתה|name|שם/i.test(r.join(' ')) && !st.classes.some(c=>c.name===r[0]||c.nameHe===r[0])) return;
    let [cls, a, b] = r;
    if(!cls) return;
    let en = a||'', h = b||'';
    if(!h && isHeb(en)){ h = en; en = ''; }
    if(!en && !h) return;
    out.push({cls, en, h});
  });
  return out;
}

/* =====================================================================
   Scores – Hebrew, right to left. Tab moves across, Enter moves down.
   ===================================================================== */
let scoreClassId = '', scoreMonthId = '';
function buildColumnDefs(cls, wc){
  const defs = [{type:'chesarim', he:'חסר'},{type:'ichurim', he:'איחור'},{type:'yatza', he:'יצא מוקדם'}];
  cls.subjects.filter(s=>s.kind==='cat').forEach(s=> defs.push({type:'cat', id:s.id, he:s.label}));
  const ws = cls.subjects.filter(s=>s.kind==='week');
  for(let w=0; w<wc; w++) ws.forEach(s=> defs.push({type:'week', id:s.id, week:w, he:s.label}));
  return defs;
}
function validCell(def, raw){
  const v = String(raw??'').trim(); if(v==='') return true;
  const n = Number(v); if(isNaN(n)) return false;
  if(def.type==='cat') return n>=1 && n<=10;
  if(def.type==='week') return n>=0 && n<=100;
  return Number.isInteger(n) && n>=0 && n<=31;
}
function cellValue(d, def){ if(def.type==='cat') return (d.cat||{})[def.id]; if(def.type==='week') return ((d.week||{})[def.id]||[])[def.week]; return d[def.type]; }
function setCellValue(d, def, v){ if(def.type==='cat') d.cat[def.id] = v; else if(def.type==='week'){ if(!d.week[def.id]) d.week[def.id] = ['','','','','']; d.week[def.id][def.week] = v; } else d[def.type] = v; }
function gridHead(cls, wc, parshiot, editable){
  const catS = cls.subjects.filter(s=>s.kind==='cat'), weekS = cls.subjects.filter(s=>s.kind==='week');
  let g = `<tr class="grp"><th rowspan="2">תלמיד</th><th colspan="3" class="gs">נוכחות</th>`;
  if(catS.length) g += `<th colspan="${catS.length}" class="gs">ניקוד (1–10)</th>`;
  for(let w=0; w<wc; w++){
    if(!weekS.length) continue;
    let ctl = '';
    if(editable && w===wc-1 && wc<5) ctl = `<button type="button" class="wk-btn" data-wk="add" data-tip="Add week 5">+</button>`;
    if(editable && w===4) ctl = `<button type="button" class="wk-btn" data-wk="remove" data-tip="Remove week 5">×</button>`;
    g += `<th colspan="${weekS.length}" class="wkh gs"><div class="wk">שבוע ${w+1} ${ctl}</div><input type="text" class="parsha" data-idx="${w}" dir="rtl" placeholder="פרשה" value="${esc(parshiot[w]||'')}"></th>`;
  }
  const defs = buildColumnDefs(cls, wc), gs = groupStarts(defs);
  g += '</tr><tr>' + defs.map((d,i)=>`<th class="${gs[i]?'gs':''}">${esc(d.he)}</th>`).join('');
  return g + '</tr>';
}

function renderScoresGrid(){

    students.length ? students.map((s,r)=>{
      if(!rec.perStudent[s.id]) rec.perStudent[s.id] = emptyStudentRecord(cls);
      const d = ensureRecordShape(rec.perStudent[s.id], cls);
      return `<tr><td class="name">${esc(heName(s))}</td>` + defs.map((def,c)=>{ const v = cellValue(d, def)||''; return `<td class="${validCell(def,v)?'':'bad'}${gs[c]?' gs':''}"><input type="text" inputmode="numeric" data-row="${r}" data-col="${c}" value="${esc(v)}" ${ro?'readonly tabindex="-1"':''}></td>`; }).join('') + '</tr>';
    }).join('') : `<tr><td colspan="${defs.length+1}"><div class="empty">No students in this class</div></td></tr>`
  }</tbody></table></div>`;
  if(ro){ box.querySelectorAll('.parsha').forEach(i=>{ i.readOnly = true; i.tabIndex = -1; }); return; }
  box.querySelectorAll('.parsha').forEach(inp=> inp.addEventListener('input', ()=>{ rec.parshiot[+inp.dataset.idx] = inp.value; saveAll('Scores', label); }));
  box.querySelectorAll('.wk-btn').forEach(b=> b.addEventListener('click', ()=>{ rec.weekCount = b.dataset.wk==='add' ? 5 : 4; saveAll(rec.weekCount===5?'Add week 5':'Remove week 5', label); renderScoresGrid(); }));
  const inputs = Array.from(box.querySelectorAll('tbody input'));
  inputs.forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const r = +inp.dataset.row, c = +inp.dataset.col;
      setCellValue(rec.perStudent[students[r].id], defs[c], inp.value.trim());
      inp.parentElement.classList.toggle('bad', !validCell(defs[c], inp.value));
      saveAll('Scores', label);
    });
    inp.addEventListener('focus', ()=> inp.select());
    inp.addEventListener('keydown', e=>{
      if(['Enter','Tab','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){ e.preventDefault(); moveFocus(inp, e.key, inputs, students.length, defs.length, e.shiftKey); }
    });
  });
}
function moveFocus(cur, key, inputs, nRows, nCols, shift){
  const r = +cur.dataset.row, c = +cur.dataset.col; let nr = r, nc = c;
  if(key==='Tab'){ // across (right to left), wraps to the next row
    if(shift){ nc = c-1; if(nc<0){ nc = nCols-1; nr = (r-1+nRows)%nRows; } }
    else { nc = c+1; if(nc>=nCols){ nc = 0; nr = (r+1)%nRows; } }
  }
  else if(key==='Enter'){ nr = shift ? Math.max(0, r-1) : r+1; if(nr>=nRows){ nr = 0; nc = (c+1)%nCols; } }
  else if(key==='ArrowUp') nr = Math.max(0, r-1);
  else if(key==='ArrowDown') nr = Math.min(nRows-1, r+1);
  else if(key==='ArrowLeft') nc = Math.min(nCols-1, c+1);
  else if(key==='ArrowRight') nc = Math.max(0, c-1);
  const t = inputs.find(i=>+i.dataset.row===nr && +i.dataset.col===nc);
  if(t){ t.focus(); t.select(); }
}

    if(!opt.combined && docs.length>1) await loadScript(LIB_ZIP, 'JSZip');
  }catch(e){ closeModal(); pdfJob = null; toast('Could not load the PDF tool. Check the internet connection.'); return; }
  const land = !!opt.landscape, W = land ? 11 : 8.5, Hh = land ? 8.5 : 11, fontCss = ($('reportFontFace')||{}).textContent || '';
  const host = document.createElement('div');
  host.style.cssText = 'position:fixed;left:-30000px;top:0;z-index:-1;';
  document.body.appendChild(host);
  const total = docs.reduce((n,d)=> n + (d.pages || 1), 0);
  let done = 0;
  const newPdf = ()=> new window.jspdf.jsPDF({orientation: land ? 'landscape' : 'portrait', unit:'in', format:'letter', compress:true});
  const zip = (!opt.combined && docs.length>1) ? new window.JSZip() : null;
  let pdf = opt.combined ? newPdf() : null, first = true;
  try{
    for(const d of docs){
      if(job.cancel) break;
      host.innerHTML = (opt.css ? `<style>${opt.css}</style>` : '') + d.html;
      await Promise.all(Array.from(host.querySelectorAll('img')).map(i=> i.decode ? i.decode().catch(()=>{}) : null));
      if(document.fonts) await document.fonts.ready;
      fitReports(host);
      if(!opt.combined){ pdf = newPdf(); first = true; }
      for(const pg of Array.from(host.querySelectorAll(opt.selector || '.report-page, .sheet'))){
        if(job.cancel) break;
        setProgress(done, total, `${d.label || d.name} · ${done+1} of ${total}`);
        const url = await window.htmlToImage.toJpeg(pg, {quality:.95, pixelRatio:3, backgroundColor:'#ffffff', fontEmbedCSS: fontCss, cacheBust:false});
        if(!first) pdf.addPage('letter', land ? 'landscape' : 'portrait');
        pdf.addImage(url, 'JPEG', 0, 0, W, Hh, undefined, 'FAST'); first = false;
        done++;
      }
      if(job.cancel) break;
      if(!opt.combined){ if(zip) zip.file((d.folder ? safeFile(d.folder)+'/' : '')+safeFile(d.name)+'.pdf', pdf.output('blob')); else pdf.save(safeFile(d.name)+'.pdf'); }
    }
    if(job.cancel){ toast('Cancelled'); return; }
    setProgress(total, total, 'Saving…');
    if(opt.combined) pdf.save(safeFile(opt.name)+'.pdf');
    else if(zip) saveBlob(await zip.generateAsync({type:'blob'}), safeFile(opt.name)+'.zip');
    toast('Downloaded');
  }catch(e){ console.error(e); toast('Could not make the PDF'); }
  finally{ host.remove(); pdfJob = null; closeModal(); }
}
// asks combined or one file each, then makes the PDFs
function askPdf(docs, opt){
  if(docs.length<=1) return makePdfs(docs, Object.assign({combined:true, name: docs[0] && docs[0].name}, opt));
  openModal(`<h2>Download PDF</h2><p class="small muted" style="margin-bottom:12px;">${docs.length} ${esc(opt.unit||'files')}${opt.extra?' · '+esc(opt.extra):''}</p>

function sheetLayout(cls, monthId){
  ensureClassShape(cls);
  const rec = recFor(cls.id, monthId), wc = rec ? rec.weekCount : 4;
  return {
    rows: sortedStudents(cls.id).map(s=>({sid:s.id, nameHe: heName(s)})),
    cols: buildColumnDefs(cls, wc).map(d=>({type:d.type, id:d.id, week:d.week, he:d.he})),
    weekCount: wc,
    classHe: heName(cls), teacherHe: heName(teacherOf(cls))
  };
}
const layoutSig = l => hashStr(JSON.stringify(l));
function newCode(){ const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c; do{ c = 'GH-'; for(let i=0;i<5;i++) c += A[Math.floor(Math.random()*A.length)]; }while(Object.values(st.sheets).some(s=>s.code===c)); return c; }
function sheetState(cls, monthId){
  const sh = st.sheets[gradeKey(cls.id, monthId)];
  if(!sh) return 'none';
  if(sh.sig !== layoutSig(sheetLayout(cls, monthId))) return 'stale';
  return sh.scannedAt ? 'scanned' : 'generated';
}
const STATE_TAG = {none:'<span class="tag">Not generated</span>', generated:'<span class="tag wait">Generated</span>', stale:'<span class="tag warn">Changed since generated</span>', scanned:'<span class="tag ok">Scanned</span>'};
const sheetClasses = () => st.classes.filter(c=>studentsOf(c.id).length);
function generateSheet(cls, monthId){
  const layout = sheetLayout(cls, monthId);
  st.sheets[gradeKey(cls.id, monthId)] = {code:newCode(), at:Date.now(), layout, sig:layoutSig(layout), scannedAt:null};
}
function findSheetByCode(raw){
  const m = String(raw||'').toUpperCase().replace(/\s+/g,'').match(/GH-?([A-Z0-9]{5})(?:-?P(\d+))?/);
  if(!m) return null;
  const code = 'GH-'+m[1];
  const key = Object.keys(st.sheets).find(k=>st.sheets[k].code===code);
  return key ? {key, page:1} : null;
}

/* ---------- Claude ---------- */
const aiKey = () => { if(CLOUD) return secrets.key || ''; try{ return localStorage.getItem('gh:ai-key') || ''; }catch(e){ return ''; } };
const aiModel = () => { if(CLOUD) return secrets.model || 'claude-opus-5-5'; try{ return localStorage.getItem('gh:ai-model') || 'claude-opus-5-5'; }catch(e){ return 'claude-opus-5-5'; } };
async function aiCall(content, maxTokens){
  const key = aiKey(); if(!key){ const e = new Error('No API key'); e.nokey = true; throw e; }
  let res;
  try{
    res = await fetch('https://api.anthropic.com/v1/messages', {method:'POST', headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body: JSON.stringify({model: aiModel(), max_tokens: maxTokens||4000, messages:[{role:'user', content}]})});
  }catch(e){ throw new Error('Could not reach Claude. Check the internet connection.'); }
  let body = null; try{ body = await res.json(); }catch(e){}
  if(!res.ok){
    let msg = body && body.error && body.error.message || ('HTTP '+res.status);
    if(res.status===402 || /credit balance|purchase credits|billing/i.test(msg)){ const ce = new Error(CREDITS_MSG); ce.credits = true; throw ce; }
    if(res.status===401) msg = 'The API key was rejected. Check it in Settings → AI Scanning.';
    throw new Error(msg);
  }
  return (body && body.content || []).filter(b=>b.type==='text').map(b=>b.text).join('\n');
}
function aiJson(text){ const t = String(text||'').replace(/```(?:json)?/g,''), a = t.indexOf('{'), b = t.lastIndexOf('}'); if(a<0 || b<a) throw new Error('Claude did not return a readable answer'); return JSON.parse(t.slice(a, b+1)); }
function canvasJpeg(canvas, maxSide, q){
  const s = Math.min(1, (maxSide||2000)/Math.max(canvas.width, canvas.height)), c = document.createElement('canvas');
  c.width = Math.round(canvas.width*s); c.height = Math.round(canvas.height*s);
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(canvas,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg', q||.9).split(',')[1];
}
const loaded = {};
function loadScript(src, globalName){
  if(window[globalName]) return Promise.resolve();
  if(loaded[src]) return loaded[src];
  return loaded[src] = new Promise((res, rej)=>{ const s = document.createElement('script'); s.src = src; s.onload = ()=>res(); s.onerror = ()=>{ delete loaded[src]; rej(new Error('Could not load '+src)); }; document.head.appendChild(s); });
}
async function detectQr(canvas){
  try{
    await loadScript('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js', 'jsQR');
    const tries = [canvas];
    const crop = (x,y,w,h,sc)=>{ const c = document.createElement('canvas'); c.width = Math.round(w*sc); c.height = Math.round(h*sc); c.getContext('2d').drawImage(canvas, x,y,w,h, 0,0,c.width,c.height); return c; };
    const W = canvas.width, H = canvas.height;
    tries.push(crop(0,0,W*.4,H*.4,1.5), crop(W*.6,0,W*.4,H*.4,1.5), crop(0,H*.6,W*.4,H*.4,1.5), crop(W*.6,H*.6,W*.4,H*.4,1.5));
    for(const c of tries){
      const im = c.getContext('2d').getImageData(0,0,c.width,c.height);
      const r = window.jsQR(im.data, im.width, im.height, {inversionAttempts:'attemptBoth'});
      if(r && r.data) return r.data;
    }
  }catch(e){}
  return null;
}
async function aiReadCode(canvas){

    {type:'text', text:'This is a scanned assessment sheet. In the top corner, under a QR code, there is a printed code like "GH-ABCDE-P1". Reply with JSON only: {"code":"<the code exactly, or empty string if not visible>"}'}], 200);
  return String(aiJson(txt).code||'').trim();
}
function colDescription(c){
  if(c.type==='chesarim') return 'Absent (חסר) – number of days, whole number';
  if(c.type==='ichurim') return 'Late (איחור) – number of times, whole number';
  if(c.type==='yatza') return 'Left early (יצא מוקדם) – number of times, whole number';
  if(c.type==='cat') return `monthly score "${c.he}" – a number from 1 to 10`;
  return `week ${c.week+1}, "${c.he}" – a score from 0 to 100`;
}
async function aiReadSheet(canvas, sh, page){
  const L = sh.layout, rows = L.rows.slice((page-1)*ROWS_PER_PAGE, page*ROWS_PER_PAGE);
  const roster = rows.map((r,i)=>`${i+1}. ${r.nameHe}`).join('\n');
  const cols = L.cols.map((c,i)=>`"c${i}" = ${colDescription(c)}`).join('\n');
  const prompt = `You are reading a scanned, hand-filled Hebrew class assessment sheet (it may be rotated or skewed – read it in whatever orientation it is in).
The table is right-to-left. Each row is one student. The four black squares at the corners are alignment markers – ignore them.
The students, in printed order top to bottom (the printed row number is before each name):
${roster}

After the "#" and student-name columns, the score columns, reading from RIGHT to LEFT, are:
${cols}

Above each week's columns there is a line "פרשה:" where the teacher may have written the name of the parsha in Hebrew.

Rules:
- Read every row's own handwriting separately. Never copy one row's numbers into another row.
- A blank cell must be left out. Never guess a value for an empty box.
- Common confusions: 1 vs 7, 4 vs 9, 5 vs 6 vs 8, 0 vs 6. If you can read a number but are not fully sure, still give it and set "sure": false.
- Numbers only (digits), no words.

Reply with JSON only, no prose:
{"code":"<printed code under the QR, e.g. GH-ABCDE-P1>","parsha":{"1":"<week 1 parsha or empty>"},"rows":[{"row":1,"name":"<printed name>","cells":{"c0":{"v":2,"sure":true}}}]}
Include one entry per printed student row (rows with nothing written may have empty "cells").`;
  const txt = await aiCall([{type:'image', source:{type:'base64', media_type:'image/jpeg', data:canvasJpeg(canvas,2300,.92)}}, {type:'text', text:prompt}], 8000);
  const out = aiJson(txt), outRows = Array.isArray(out.rows) ? out.rows : [];
  const norm = s => String(s||'').replace(/[^א-תa-zA-Z0-9]/g,'');
  const values = {}, unsure = {};
  rows.forEach((r,i)=>{
    const want = norm(r.nameHe), dup = rows.filter(z=>norm(z.nameHe)===want).length>1;
    const row = outRows.find(x=>Number(x.row)===i+1) || (!dup && outRows.find(x=>norm(x.name)===want)) || null;
    if(!row || !row.cells) return;
    Object.entries(row.cells).forEach(([k, cell])=>{
      const ci = Number(String(k).replace(/^c/,'')); if(!(ci>=0 && ci<L.cols.length)) return;
      const v = cell && typeof cell==='object' ? cell.v : cell;
      if(v===null || v===undefined || String(v).trim()==='') return;
      const val = String(v).trim();
      (values[r.sid] = values[r.sid] || {})[ci] = val;
      if((cell && cell.sure===false) || !validCell(L.cols[ci], val)) (unsure[r.sid] = unsure[r.sid] || {})[ci] = true;
    });
  });
  const parsha = {};
  if(out.parsha && typeof out.parsha==='object') Object.entries(out.parsha).forEach(([w,t])=>{ const n = Number(w); if(n>=1 && n<=5 && String(t||'').trim()) parsha[n-1] = String(t).trim(); });
  return {values, unsure, parsha, code: out.code};
}

async function fileToCanvases(file){
  const out = [];
  if(/pdf$/i.test(file.type) || /\.pdf$/i.test(file.name)){
    await loadScript('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js', 'pdfjsLib');
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
    const pdf = await window.pdfjsLib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
    for(let n=1; n<=pdf.numPages; n++){
      const page = await pdf.getPage(n), v = page.getViewport({scale:2.2}), c = document.createElement('canvas');
      c.width = Math.round(v.width); c.height = Math.round(v.height);
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height);
      await page.render({canvasContext:ctx, viewport:v}).promise;
      out.push({canvas:c, name: file.name+(pdf.numPages>1?' · p'+n:'')});
    }
  } else {
    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej)=>{ const i = new Image(); i.onload = ()=>res(i); i.onerror = ()=>rej(new Error('Could not open '+file.name)); i.src = url; });
    const s = Math.min(1, 2600/Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth*s); c.height = Math.round(img.naturalHeight*s);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);
    out.push({canvas:c, name:file.name});
  }
  return out;
}

async function processQueue(){
  if(!scan || scan.busy) return;
  scan.busy = true; scan.stop = false;
  for(const pg of scan.pages){
    if(scan.stop) break;
    if(pg.status!=='queued') continue;
    pg.status = 'reading'; pg.error = ''; renderScanArea();
    try{
      if(!pg.key){
        let code = await detectQr(pg.canvas);
        let found = code && findSheetByCode(code);
        if(!found){ code = await aiReadCode(pg.canvas); found = code && findSheetByCode(code); }
        if(!found){ pg.status = 'nomatch'; renderScanArea(); continue; }
        pg.key = found.key; pg.page = found.page;
      }
      const sh = st.sheets[pg.key];
      if(!sh){ pg.status = 'nomatch'; pg.key = null; renderScanArea(); continue; }
      const r = await aiReadSheet(pg.canvas, sh, pg.page);
      Object.assign(pg, {values:r.values, unsure:r.unsure, parsha:r.parsha, status:'ready'});
    }catch(err){
      pg.status = 'error'; pg.error = err.message;
      if(err.credits || err.nokey){ scan.stop = true; scan.notice = err.message; }
    }
    renderScanArea();
  }
  scan.busy = false; renderScanArea();
}

function showPreview(box, pageHtml){

/* ---------- view in the app: one page at a time ---------- */
// pages: [{label, html}], opt: {landscape, onPrint, onPdf}
function openViewer(title, pages, opt){
  if(!pages.length) return;
  opt = opt || {}; let i = 0;
  const draw = box=>{
    const p = pages[i];
    box.querySelector('#vwCount').textContent = (i+1)+' / '+pages.length;
    box.querySelector('#vwSel').value = String(i);
    const area = box.querySelector('#vwArea');
    if(opt.landscape){
      area.innerHTML = `<style>${SHEET_CSS}</style><div class="vw-land">${p.html}</div>`;
      const wrap = area.querySelector('.vw-land'), sh = wrap.querySelector('.sheet'), sc = Math.min(1, (area.clientWidth-4)/1056);
      wrap.style.cssText = `width:${1056*sc}px;height:${816*sc}px;margin:0 auto;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.15);`;
      sh.style.transform = `scale(${sc})`; sh.style.transformOrigin = 'top left';
    } else showPreview(area, p.html);
  };
  openModal(`<div class="card-head"><h2 style="margin:0;">${esc(title)}</h2><span class="sp"></span>
      ${iconBtn('left','Previous','data-pg="-1"')}<select id="vwSel" dir="rtl" style="max-width:220px;">${pages.map((p,k)=>`<option value="${k}">${esc(p.label)}</option>`).join('')}</select><span id="vwCount" class="small muted"></span>${iconBtn('right','Next','data-pg="1"')}
      <span style="width:10px;"></span>${opt.onPrint?`<button class="btn sec sm" data-a="print">${ICON.print}Print</button>`:''}${opt.onPdf?`<button class="btn sec sm" data-a="pdf">${ICON.download}PDF</button>`:''}<button class="btn sm" data-a="close">Close</button></div>
    <div id="vwArea" style="background:#e9eeee;padding:10px;border-radius:8px;max-height:78vh;overflow:auto;${opt.landscape?'':'max-width:760px;margin:0 auto;'}"></div>`, box=>{
    box.querySelectorAll('[data-pg]').forEach(b=> b.onclick = ()=>{ i = (i + Number(b.dataset.pg) + pages.length) % pages.length; draw(box); });
    box.querySelector('#vwSel').onchange = e=>{ i = Number(e.target.value); draw(box); };
    box.querySelector('[data-a=close]').onclick = closeModal;
    if(opt.onPrint) box.querySelector('[data-a=print]').onclick = opt.onPrint;
    if(opt.onPdf) box.querySelector('[data-a=pdf]').onclick = ()=>{ closeModal(); opt.onPdf(); };
    draw(box);
  }, true);
}
function viewReports(items, title, pdfName, folders){

      const n = studentsOf(c.id).length, rec = recFor(c.id, month.id), filled = rec ? studentsOf(c.id).filter(s=>hasAnyScore(rec.perStudent[s.id])).length : 0, dis = filled ? '' : 'disabled';

  P.querySelectorAll('[data-mact]').forEach(b=> b.addEventListener('click', e=>{

  }));
  P.querySelectorAll('[data-ract]').forEach(b=> b.addEventListener('click', e=>{
    e.stopPropagation();

function renderRepPreview(){

const REPORT_TEXT_FIELDS = [['title','Title'],['signature','Signature'],['lead','Opening text · {month}','full'],['classLine','Class line · {class} {teacher}','full'],['note','Note','full'],['scoreNote','Score note','full'],['weekHeader','Weekly column'],['lateHeader','Late'],['absentHeader','Absent'],['earlyHeader','Left early'],['failText','Weekly score below the limit']];
let setupPv = {classId:'', sid:'', monthId:''};
function renderReportSetup(box){
  const L = st.layout;
  box.innerHTML = `<div class="designer"><div>
    <details class="grp" ${st.reportPresets.length?'':''}><summary>Saved Designs</summary><div class="body">
      <div class="row nowrap"><select id="presetSel" style="flex:1;"><option value="">Choose a design</option>${options(st.reportPresets, p=>p.id, p=>p.name, '')}</select>${iconBtn('trash','Delete design','id="presetDel"','danger')}</div>
      <div class="row nowrap" style="margin-top:8px;"><input type="text" id="presetName" placeholder="Design name" style="flex:1;"><button class="btn" id="presetSave">Save</button></div></div></details>
    <details class="grp" open><summary>Letterhead &amp; Margins (mm)</summary><div class="body">
      <div class="sizes">${[['topMM','Top'],['bottomMM','Bottom'],['rightMM','Right'],['leftMM','Left']].map(([k,l])=>`<div class="field"><label>${l}</label><input type="number" min="0" max="140" data-margin="${k}" value="${L[k]}"></div>`).join('')}</div>
      <div class="row" style="margin-top:10px;"><label class="btn sec" for="lhFile" style="cursor:pointer;">Upload letterhead</label><input type="file" id="lhFile" accept="image/*,.pdf" style="display:none;"><button class="btn sec" id="lhReset">Default letterhead</button></div></div></details>
    <details class="grp" open><summary>Text Sizes</summary><div class="body"><div class="sizes">${Object.keys(SIZE_LABELS).map(k=>`<div class="field"><label>${SIZE_LABELS[k]}</label><input type="number" min="8" max="60" data-size="${k}" value="${st.sizes[k]}"></div>`).join('')}</div></div></details>
    <details class="grp"><summary>Report Text</summary><div class="body"><div class="fields">${REPORT_TEXT_FIELDS.map(([k,l,full])=>`<div class="field ${full||''}"><label>${esc(l)}</label>${['lead','note'].includes(k)?`<textarea dir="rtl" data-rt="${k}">${esc(st.reportText[k]||'')}</textarea>`:`<input type="text" dir="rtl" data-rt="${k}" value="${esc(st.reportText[k]||'')}">`}</div>`).join('')}</div></div></details>
  </div><div>
    <div class="row" style="margin-bottom:8px;"><select id="spCls">${options(st.classes, c=>c.id, classLabel, setupPv.classId)}</select><select id="spStu" dir="rtl"></select><select id="spMonth" dir="rtl">${options(sortedMonths(), m=>m.id, m=>m.label, setupPv.monthId)}</select></div>
    <div class="preview-box"><div id="spPv" style="width:100%;"></div></div></div></div>`;
  const refreshStu = ()=>{ const list = studentsOf($('spCls').value); $('spStu').innerHTML = options(list, s=>s.id, s=>heName(s), setupPv.sid); setupPv.sid = $('spStu').value; };
  if(!setupPv.classId && st.classes[0]) $('spCls').value = st.classes[0].id;
  if(!setupPv.monthId){ const ms = sortedMonths().filter(m=>st.classes.some(c=>monthHasScores(c.id,m.id))); if(ms.length) $('spMonth').value = ms[ms.length-1].id; }
  setupPv.classId = $('spCls').value; setupPv.monthId = $('spMonth').value; refreshStu();
  const pv = ()=>{
    const cls = classById(setupPv.classId), m = monthById(setupPv.monthId), s = cls && studentsOf(cls.id).find(x=>x.id===setupPv.sid);
    if(!cls || !m || !s){ $('spPv').innerHTML = '<div class="empty">Add a student to see the preview</div>'; return; }
    showPreview($('spPv'), reportPageHtml(cls, m, s, recFor(cls.id, m.id), {letterhead:true}));
  };
  $('spCls').onchange = e=>{ setupPv.classId = e.target.value; setupPv.sid = ''; refreshStu(); pv(); };
  $('spStu').onchange = e=>{ setupPv.sid = e.target.value; pv(); };
  $('spMonth').onchange = e=>{ setupPv.monthId = e.target.value; pv(); };
  box.querySelectorAll('[data-margin]').forEach(i=> i.addEventListener('input', ()=>{ st.layout[i.dataset.margin] = Math.max(0, Number(i.value)||0); saveAll('Report margins'); pv(); }));
  box.querySelectorAll('[data-size]').forEach(i=> i.addEventListener('input', ()=>{ st.sizes[i.dataset.size] = Math.min(60, Math.max(8, Number(i.value)||12)); saveAll('Report text sizes'); pv(); }));
  box.querySelectorAll('[data-rt]').forEach(i=> i.addEventListener('input', ()=>{ st.reportText[i.dataset.rt] = i.value; saveAll('Report text'); pv(); }));
  $('lhFile').onchange = async e=>{
    const f = e.target.files[0]; e.target.value = ''; if(!f) return;
    let url, w = 0;
    try{
      if(/pdf$/i.test(f.type) || /\.pdf$/i.test(f.name)){
        // PDF: first page at 300 dpi (2550 × 3300 for letter size)
        toast('Reading the PDF…');
        await loadScript('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js', 'pdfjsLib');
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
        const pdf = await window.pdfjsLib.getDocument({data: new Uint8Array(await f.arrayBuffer())}).promise;
        const page = await pdf.getPage(1), v1 = page.getViewport({scale:1}), v = page.getViewport({scale: 2550 / v1.width});
        const c = document.createElement('canvas'); c.width = Math.round(v.width); c.height = Math.round(v.height);
        const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height);
        await page.render({canvasContext:ctx, viewport:v}).promise;
        url = c.toDataURL('image/jpeg', .9); w = c.width;
      } else {
        url = await new Promise((res, rej)=>{ const r = new FileReader(); r.onload = ()=>res(r.result); r.onerror = rej; r.readAsDataURL(f); });
        w = await new Promise(res=>{ const i = new Image(); i.onload = ()=>res(i.naturalWidth); i.onerror = ()=>res(0); i.src = url; });
      }
    }catch(err){ toast('Could not read that file'); return; }
    assets.letterheadDataUrl = url; currentLetterheadDataUrl = url;
    persistAssets(); logEvent('Letterhead uploaded', f.name); pv();
    if(w && w < 1700) openModal(`<h2>Low-resolution letterhead</h2><p>This image is only ${w} pixels wide, so it will print blurry. For sharp printing use a PDF of the letterhead, or an image at least 2550 × 3300 pixels.</p><div class="actions"><button class="btn" data-a="ok">OK</button></div>`, b=>{ b.querySelector('[data-a=ok]').onclick = closeModal; });
    else toast('Letterhead updated');
  };
  $('lhReset').onclick = ()=>{ assets.letterheadDataUrl = null; currentLetterheadDataUrl = DEFAULT_LETTERHEAD_DATAURL; persistAssets(); logEvent('Letterhead reset to default'); pv(); };
  $('presetSel').onchange = e=>{
    const p = st.reportPresets.find(x=>x.id===e.target.value); if(!p) return;
    st.layout = Object.assign({}, DEFAULT_LAYOUT, clone(p.layout||{})); st.sizes = Object.assign({}, DEFAULT_SIZES, clone(p.sizes||{})); st.reportText = Object.assign({}, DEFAULT_REPORT_TEXT, clone(p.reportText||{}));

  };
  $('presetSave').onclick = ()=>{
    const name = $('presetName').value.trim(); if(!name){ $('presetName').focus(); return; }
    const d = {layout:clone(st.layout), sizes:clone(st.sizes), reportText:clone(st.reportText)};
    let p = st.reportPresets.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(p) Object.assign(p, d); else { p = Object.assign({id:uid(), name}, d); st.reportPresets.push(p); }
    saveAll('Save design', name); toast('Design saved'); renderReportSetup(box);
  };
  $('presetDel').onclick = async ()=>{
    const p = st.reportPresets.find(x=>x.id===$('presetSel').value); if(!p) return;
    if(!await askConfirm('Delete design '+p.name+'?')) return;
    st.reportPresets = st.reportPresets.filter(x=>x.id!==p.id); saveAll('Delete design', p.name); doneWithUndo('Design deleted'); renderReportSetup(box);
  };
  pv();
}
